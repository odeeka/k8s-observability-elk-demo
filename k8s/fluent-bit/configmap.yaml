apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
  labels:
    app: fluent-bit
data:
  # -------------------------------------------------------------------------
  # Main Fluent Bit configuration
  # -------------------------------------------------------------------------
  fluent-bit.conf: |
    [SERVICE]
        Flush             1
        Log_Level         info
        Daemon            off
        Parsers_File      /fluent-bit/etc/parsers.conf
        # Built-in HTTP server for health / metrics
        HTTP_Server       On
        HTTP_Listen       0.0.0.0
        HTTP_Port         2020

    # Tail all container log files on the node
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        # multiline.parser handles both containerd (CRI) and Docker runtime formats
        multiline.parser  cri, docker
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        # SQLite DB to track file offsets across restarts
        DB                /var/log/flb_kube.db

    # Enrich log records with Kubernetes pod / namespace / container metadata.
    # Merge_Log parses the raw "log" field as JSON and hoists its fields to
    # the top level (so our service fields like level, service, requestId etc.
    # are directly indexable in Elasticsearch).
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        # Keep labels for Kibana filtering; skip annotations to reduce noise
        Labels              On
        Annotations         Off

    # Add a static field to identify the cluster
    [FILTER]
        Name   modify
        Match  kube.*
        Add    cluster observability-demo

    # Ship to Elasticsearch using Logstash-style daily indices: logs-YYYY.MM.DD
    [OUTPUT]
        Name                es
        Match               kube.*
        Host                elasticsearch.observability.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     logs
        Logstash_DateFormat %Y.%m.%d
        # Required for Elasticsearch 8.x (no document types)
        Suppress_Type_Name  On
        # Replace dots in field names (e.g. kubernetes.labels.app) with underscores
        Replace_Dots        On
        Retry_Limit         5
        tls                 Off
        tls.verify          Off

  # -------------------------------------------------------------------------
  # Custom parsers
  # -------------------------------------------------------------------------
  parsers.conf: |
    # containerd / CRI log format:
    # <RFC3339Nano> <stream> <flags> <message>
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    # Docker JSON log format (fallback)
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep   On

    # Standalone JSON log body parser (used by services that log raw JSON)
    [PARSER]
        Name        json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
