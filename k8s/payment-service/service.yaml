apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: apps
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  # NodePort 30002 maps to host port 8001 via KIND extraPortMappings
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30002
