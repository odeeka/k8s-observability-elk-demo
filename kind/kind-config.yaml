# KIND Cluster Configuration – Observability ELK Demo
# Single control-plane node with host port mappings for:
#   - Kibana     NodePort 30561 → localhost:5601
#   - user-svc   NodePort 30001 → localhost:3001
#   - payment-svc NodePort 30002 → localhost:8001
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: observability-demo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30561   # Kibana
        hostPort: 5601
        protocol: TCP
      - containerPort: 30001   # user-service
        hostPort: 3001
        protocol: TCP
      - containerPort: 30002   # payment-service
        hostPort: 8001
        protocol: TCP
